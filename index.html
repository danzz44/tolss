    <title>DANZZ Premium Web Tools</title>
    <!-- Premium Fonts: Plus Jakarta Sans for UI and JetBrains Mono for Code outputs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f0f9ff; /* Light sky blue background */

      code, pre {
        font-family: 'JetBrains Mono', monospace;

      /* Prevent selection of API keys as per user requirement: BIKIN KAN APIKEY NYA GABISA DISALIN */

        user-select: none !important;
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
      }
    </style>
  </head>
  <body class="bg-sky-50 text-slate-800 antialiased selection:bg-sky-200">
